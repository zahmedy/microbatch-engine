name: Lint and Test Job

# Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Define which Python versions you want to support
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Caching dependencies speeds up subsequent runs
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # This installs your project in editable mode along with test dependencies
          # Assumes you have a [project.optional-dependencies] section in pyproject.toml
          # If not, 'pip install . pytest' works too.
          pip install . pytest 

      - name: Run tests with pytest
        run: |
          # We set the PYTHONPATH to include 'src' so tests can find your module
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          pytest tests/