[project]
name = "microbatch-engine"
version="0.1.0"
description = "Micro-batch training engine to master PyTorch shapes, grad accumulation, and AMP."
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "tqdm",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]